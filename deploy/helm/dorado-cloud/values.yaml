# Default values for the Dorado Cloud Helm chart.

replicaCount: 2

image:
  registry: ghcr.io
  repository: project-dorado/dorado-cloud-api
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

gateway:
  enabled: true
  image:
    registry: ghcr.io
    repository: project-dorado/dorado-cloud-gateway
  replicaCount: 2

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cloud.dorado.example
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Public issuer URL advertised by OpenIddict (must be the externally reachable HTTPS origin).
auth:
  issuer: "https://cloud.dorado.example/"
  disableTransportSecurity: false

# External PostgreSQL. Leave `postgres.enabled` true to deploy a small in-cluster instance.
postgres:
  enabled: true
  image: postgres:16-alpine
  database: doradocloud
  username: dorado
  password: ""        # REQUIRED when postgres.enabled; supply via --set or an existing secret
  existingSecret: ""  # use an existing secret with key `postgres-password` instead
  persistence:
    size: 8Gi

redis:
  enabled: true
  image: redis:7-alpine

minio:
  enabled: true
  image: minio/minio:latest
  bucket: dorado-cloud
  accessKey: ""
  secretKey: ""
  existingSecret: ""
  persistence:
    size: 16Gi

otel:
  endpoint: ""

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
