{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "dorado-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "postgres.password is required when postgres.enabled and no existingSecret is set" .Values.postgres.password | quote }}
{{- end }}
